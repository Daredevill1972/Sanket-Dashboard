<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield-alert.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="description" content="Offline-First National Disaster Response Dashboard for India with NDMA CAP Feed Ingestion, MapLibre GL Geospatial Hazards, and Local IndexedDB SOS Broadcast Queue" />
    <title>RAKSHAK: Offline Disaster Response Dashboard (India)</title>
    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#0a0f1d] text-slate-100 overflow-x-hidden selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
